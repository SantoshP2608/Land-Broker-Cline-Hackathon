[project]
name = "karnataka-land-demo"
version = "0.1.0"
description = "Synthetic Karnataka land marketplace demo API"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "pwdlib[argon2]>=0.2,<1",
  "pillow>=11,<13",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]